name: Verify pager overlay on Android
on:
  workflow_dispatch:
  push:
    branches: ['codex/pager-native-*']
    paths: ['companions/android/**', 'public/downloads/branda-pager-android.apk', '.github/workflows/pager-companion-android.yml']
permissions:
  contents: read
jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Enable runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 companions/android/test/overlay_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pager-native-window-api-${{ matrix.api }}
          path: native-smoke-windows.txt
          if-no-files-found: ignore
